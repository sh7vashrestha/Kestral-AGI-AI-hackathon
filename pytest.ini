[pytest]
testpaths = tests
# live tests hit the real llama-server (slow); run them explicitly with: pytest -m live
addopts = -m "not live and not sitl"
markers =
    live: needs a running llama-server (skipped when /health is unreachable)
    sitl: needs the ArduPilot SITL binary (~/ardupilot/build/sitl/bin/arducopter); run with: pytest -m sitl
asyncio_default_fixture_loop_scope = function
